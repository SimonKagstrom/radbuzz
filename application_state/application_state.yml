# This is the list of all used parameters, and their default values
cpp_includes:
  - "tile_constants.hh"

application_state:
  turn_symbol: TurnSymbol::kNone
  distance_to_next: 0
  next_street: ""
  connected_wifi_ssid: ""
  is_moving: false
  can_bus_active: false
  navigation_active: false
  speed: 0
  controller_temperature: 0
  motor_temperature: 0
  battery_millivolts: 0
  battery_soc: 0
  # Also used when not stored in the NVM
  configuration:
    home_position: {}
    max_watts: 1000
    recent_power_distance: 100
    speedometer_type: SpeedometerType::kDigital
    histogram_mode: HistogramMode::kPower
    rotate_map: false
    tile_style: TileStyle::kCycle
    battery_cell_series: 7
    max_speedometer_speed: 30
    profile: Profile::kMoped30
    battery_amp_hours: 20
    wh_per_km_for_range_estimation: 10
    show_gps_speed: false
    show_clock: true
    show_speech_bubbles: true
    motor_overheat_temperature: 80
    controller_overheat_temperature: 80
    bms_overheat_temperature: 60
    cell_overheat_temperature: 50
  # Also used when not stored in the NVM
  wifi:
    networks: {}
    ssid_file_hash: 0
  # Also used when not stored in the NVM
  traccar:
    configuration: {}
    configuration_file_hash: 0
  current_power_w: 0
  wh_consumed: 0
  wh_regenerated: 0
  odometer: 0
  pixel_position: {}
  trip_distance: 0
  call_ongoing: false
  trip_duration: 0s
  trip_max_speed: 0
  trip_average_speed: 0
  estimated_range_km: 0
  overheated: false
  bms_data: {}
