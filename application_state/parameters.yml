# This is the list of all possible parameters
cpp_includes:
  - "wgs84_to_osm_point.hh"
  - "configuration_settings.hh"
  - "bms_data.hh"
  - "turn_symbols.hh"
  - "time.hh"


parameters:
  # From the phone
  navigation:
    # If the phone currently supplies navigation instructions
    active:
      type: bool

    turn_symbol:
      type: enum TurnSymbol

    # Distance to the next turn in meters
    distance_to_next:
      type: uint32_t

    next_street:
      type: std::string

  call_ongoing:
    type: bool

  # The wifi network currently connected to, empty when not connected
  connected_wifi_ssid:
    type: std::string

  is_moving:
    type: bool

  can_bus_active:
    type: bool

  speed:
    type: uint8_t

  controller_temperature:
    type: uint8_t

  motor_temperature:
    type: uint8_t

  battery_millivolts:
    type: uint16_t

  # In percent, 0..100
  battery_soc:
    type: uint8_t

  # The settings, all stored in the NVM. Separate parameters, since different threads write
  # them. See the warning in ApplicationState::CheckoutPartialSnapshot()
  configuration:
    # Not set when at 0, 0
    home_position:
      type: struct Point

    # Maximum power in watts
    max_watts:
      type: uint16_t

    # Distance in meters between power bars on the speedometer screen
    recent_power_distance:
      type: uint16_t

    speedometer_type:
      type: enum SpeedometerType

    histogram_mode:
      type: enum HistogramMode

    # Whether the map should rotate according to heading
    rotate_map:
      type: bool

    # The style of map tiles to use
    tile_style:
      type: enum TileStyle

    # Number of battery cells in series, used to calculate cell voltage from millivolts (14s3p etc)
    battery_cell_series:
      type: uint8_t

    # Maximum speed in km/h (for the analogue speedometer limits)
    max_speedometer_speed:
      type: uint8_t

    # Maximum moped speed
    profile:
      type: enum Profile

    # Battery capacity in ampere-hours (e.g., 20Ah)
    battery_amp_hours:
      type: uint8_t

    # Average watt-hours per kilometer for range estimation
    wh_per_km_for_range_estimation:
      type: uint8_t

    # Show the gps speed in small numbers
    show_gps_speed:
      type: bool

    # Show the clock (local time) at the top of the map and speedometer screens
    show_clock:
      type: bool

    # Whether to show speech bubbles with info at start
    show_speech_bubbles:
      type: bool

    # Overheating limits, in degrees Celsius
    motor_overheat_temperature:
      type: uint8_t

    controller_overheat_temperature:
      type: uint8_t

    bms_overheat_temperature:
      type: uint8_t

    cell_overheat_temperature:
      type: uint8_t

  # The wifi setup
  wifi:
    # The known networks, from SSID.TXT and the wifi menu. Stored in the NVM
    networks:
      type: struct WifiSsidData

    # Hash of the last imported SSID.TXT, so that it's only imported when changed. Stored in the
    # NVM
    ssid_file_hash:
      type: uint32_t

  demo:
    # UTC where demo mode starts the next time. Steps forward for each start, so that demo trips
    # get different times. Stored in the NVM
    next_start_utc:
      type: uint32_t

  # Uploading trips to a Traccar server
  traccar:
    # Where to upload trips, from traccar.txt. Stored in the NVM
    configuration:
      type: struct TraccarSettings

    # Hash of the last imported traccar.txt, so that it's only imported when changed. Stored in
    # the NVM
    configuration_file_hash:
      type: uint32_t

    # UTC of the last point sent from a partly uploaded trip, or 0 if there is none. Used to
    # continue an interrupted upload. Stored in the NVM
    last_sent_utc:
      type: uint32_t

    # If trips are being sent right now
    upload_active:
      type: bool

  current_power_w:
    type: int16_t

  wh_consumed:
    type: float

  wh_regenerated:
    type: float

  # In meters
  odometer:
    type: uint32_t

  # in km
  estimated_range_km:
    type: uint16_t

  trip_distance:
    type: uint32_t

  trip_duration:
    type: seconds

  trip_max_speed:
    type: uint8_t

  trip_average_speed:
    type: uint8_t

  pixel_position:
    type: struct Point

  overheated:
    type: bool

  bms_data:
    type: struct BmsData
